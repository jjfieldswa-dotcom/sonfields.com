<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonfields</title>
  <meta name="description" content="Sonfields. Something is being built here.">
  <style>
    :root {
      --bg: #f6f4ef;
      --fg: #1c1b19;
      --muted: #6b675f;
      --accent: #2f5d3a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121411;
        --fg: #ecebe6;
        --muted: #9a978e;
        --accent: #8fc79b;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { max-width: 32rem; width: 100%; }
    h1 {
      font-size: clamp(2.5rem, 9vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
    }
    p { color: var(--muted); font-size: 1.125rem; line-height: 1.5; margin: 0 0 2rem; }
    a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
    }
    a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <main>
    <h1>Sonfields</h1>
    <p>Something is being built here.</p>
  </main>
</body>
</html>
